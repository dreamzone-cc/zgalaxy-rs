[package]
name = "zgalaxy-ui"
version = "0.1.0"
edition = "2021"
description = "ZGALAXY desktop client — Slint UI over the local daemon REST API"
license = "AGPL-3.0-or-later"

[dependencies]
slint = "1"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[build-dependencies]
slint-build = "1"

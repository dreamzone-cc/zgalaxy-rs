[package]
name = "zgalaxy-rs"
version = "1.3.0"
edition = "2021"
authors = ["DreamZone Community"]
license = "AGPL-3.0-or-later"
description = "High-Performance Sovereign ZeroTier-Compatible Client & Daemon in Rust"
homepage = "https://github.com/dreamzone-cc/ZGALAXY"
repository = "https://github.com/dreamzone-cc/ZGALAXY"
readme = "README.md"
keywords = ["zerotier", "vpn", "mesh", "p2p", "networking"]
categories = ["network-programming", "cryptography", "command-line-utilities"]

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "net"] }
futures = "0.3"
async-trait = "0.1"
bytes = { version = "1.6", features = ["serde"] }
socket2 = { version = "0.5", features = ["all"] }

# Cryptography & Identity (Curve25519, Ed25519, ChaCha20-Poly1305, Salsa20, SHA-384)
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
chacha20poly1305 = "0.10"
salsa20 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
rand = "0.8"
subtle = "2.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Network & Protocol
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
etherparse = "0.15"

# Local REST/IPC Server & Web Engine
axum = { version = "0.7", features = ["json", "tokio"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1.1"

# Serialization & Formatting
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = { version = "0.4", features = ["serde"] }
byteorder = "1.5"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
anyhow = "1.0"
thiserror = "1.0"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.4", features = ["util"] }

# Linux / Unix Virtual Interface (TUN/TAP)
[target.'cfg(unix)'.dependencies]
tun = { version = "0.6", features = ["async"] }
nix = { version = "0.29", features = ["net", "fs", "signal"] }

# Windows Virtual Interface (Wintun)
[target.'cfg(windows)'.dependencies]
wintun = "0.4"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Services"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true

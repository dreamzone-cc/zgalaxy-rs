# =============================================================================
# ZTNET stack powered by zgalaxy-rs (fresh install)
# -----------------------------------------------------------------------------
# This compose file provisions a COMPLETE ztnet deployment where the network
# engine is zgalaxy-rs — zerotier-one is never installed. The zgalaxy service
# keeps the name/hostname `zerotier` purely for contract stability: ztnet
# reaches it at http://zerotier:9993 and every existing ops tool
# (scripts/deploy_161.sh, b1 tests, ROLLOUT runbook) keeps working unchanged.
#
# Usage (from the repository root, binary already built):
#   docker compose -f deploy/ztnet/docker-compose.yml -p ztnet up -d --build
#
# Variables (override in .env next to this file or via shell):
#   ZTNET_IMAGE    ztnet image          (default: sinamics/ztnet:latest)
#   NEXTAUTH_URL   public URL of ztnet  (default: http://<server-ip>:3000)
#   NEXTAUTH_SECRET  generated by setup.sh if absent
# =============================================================================
services:
  postgres:
    image: postgres:15.2-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztnet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  zerotier:
    build:
      context: ../..
      dockerfile: deploy/ztnet/Dockerfile
    image: zgalaxy-zerotier:rs
    hostname: zerotier
    container_name: zerotier
    restart: unless-stopped
    volumes:
      - zerotier:/var/lib/zerotier-one
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - app-network
    ports:
      - "9993:9993/udp"

  ztnet:
    image: ${ZTNET_IMAGE:-sinamics/ztnet:latest}
    container_name: ztnet
    working_dir: /app
    volumes:
      # Shared volume: ztnet reads authtoken.secret + identity.public of the
      # controller. This is ztnet's documented local-controller integration —
      # ztnet itself is NOT modified in any way.
      - zerotier:/var/lib/zerotier-one
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      # Point ztnet at the zgalaxy-rs daemon by its service hostname.
      ZT_ADDR: "http://zerotier:9993"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztnet
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://127.0.0.1:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET (setup.sh generates one)}
      NEXTAUTH_URL_INTERNAL: "http://ztnet:3000"
    networks:
      - app-network
    depends_on:
      - postgres
      - zerotier

volumes:
  zerotier:
  postgres-data:

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        # Fixed subnet = the allowManagementFrom CIDR written by setup.sh.
        # If you change it here, change ZTNET_MANAGE_CIDR when running setup.
        - subnet: 172.31.255.0/29
